schema_version: "2.1"

roles:
  MASTER_ORCHESTRATOR:
    scope: "Routing / State Machine / Permission Matrix / Risk Gatekeeper"
    can_write:
      - "00_SYSTEM/EXECUTION_STATE.yaml"
      - "06_HANDOFF/HANDOFF_CURRENT.md"
    cannot_write:
      - "Prose Text"
      - "Canon Source (without explicit human approval)"

  OH_STORY:
    scope: "Creative / Commercial / Market / Architecture / Packaging"
    can_read:
      - "01_CANON/"
      - "02_OUTLINE/"
      - "04_STATE/"
      - "references/"
    can_write:
      - "05_MARKETING/"
      - "02_OUTLINE/ARC_OUTLINE/proposals/"
    cannot_write:
      - "01_CANON/"
      - "04_STATE/"
      - "03_PRODUCTION/FINAL/"

  WEBNOVEL_WRITER:
    scope: "Canon / Outline / Chapter Plan / State / Continuity / Production"
    can_read:
      - "00_SYSTEM/"
      - "01_CANON/"
      - "02_OUTLINE/"
      - "03_PRODUCTION/"
      - "04_STATE/"
    can_write:
      - "01_CANON/"
      - "02_OUTLINE/"
      - "03_PRODUCTION/CONTEXT/"
      - "03_PRODUCTION/DRAFT/"
      - "03_PRODUCTION/CANON_QA/"
      - "04_STATE/"
    constraints: "Major Canon modifications require Human Approval"

  DE_AI_PROMPT_ENHANCER:
    scope: "Writing Style Protocol / Sensory Expressions / Human Rhythm Guidance"
    can_read:
      - "03_PRODUCTION/CONTEXT/"
      - "02_OUTLINE/CHAPTER_PLAN/"
    can_write:
      - "03_PRODUCTION/STYLE/"
    cannot_write:
      - "Plot Structure"
      - "01_CANON/"
      - "04_STATE/"

  LIEFLAT_LESS_AI_TONE:
    scope: "Final Language Cleanup / De-slop / Prose Polishing"
    can_read:
      - "03_PRODUCTION/DRAFT/"
      - "03_PRODUCTION/STYLE/"
    can_write:
      - "03_PRODUCTION/TONE/"
      - "03_PRODUCTION/FINAL/"
    cannot_write:
      - "Add Plot"
      - "Delete Events"
      - "Modify Character Decisions"
      - "Modify Canon"
      - "Modify Timeline"
      - "Modify Relations"
