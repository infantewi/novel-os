schema_version: "2.1"

# 核心权限法则：HUMAN > CANON > CONTINUITY > STATE > OUTLINE > PLOT > STYLE > TONE

workers:
  MASTER_ORCHESTRATOR:
    role_type: "ORCHESTRATOR"
    read_canon: true
    read_state: true
    read_outline: true
    write_draft: false
    write_canon: "AUTHORIZED_ONLY"
    write_state: "AUTHORIZED_ONLY"
    can_route: true
    allowed_write_paths:
      - "00_SYSTEM/EXECUTION_STATE.yaml"
      - "06_HANDOFF/HANDOFF_CURRENT.md"

  OH_STORY:
    role_type: "ADVISORY"
    read_canon: true
    read_state: true
    read_outline: true
    write_draft: false
    write_canon: false
    write_state: false
    can_route: false
    output_classification: "ADVISORY"
    allowed_write_paths:
      - "05_MARKETING/"

  WEBNOVEL_WRITER:
    role_type: "PRODUCTION"
    read_canon: true
    read_state: true
    read_outline: true
    write_draft: true
    write_canon: "PROPOSAL_ONLY"
    write_state: "PROPOSAL_ONLY"
    can_route: false
    output_classification: "PRODUCTION-ARTIFACT / AUTHORITATIVE-CANDIDATE"
    allowed_write_paths:
      - "03_PRODUCTION/CONTEXT/"
      - "03_PRODUCTION/DRAFT/"
      - "03_PRODUCTION/CANON_QA/"
      - "02_OUTLINE/CHAPTER_PLAN/"

  DE_AI_PROMPT_ENHANCER:
    role_type: "ADVISORY"
    read_canon: "LIMITED_READ_ONLY"
    read_state: "LIMITED_READ_ONLY"
    read_outline: false
    write_draft: false
    write_canon: false
    write_state: false
    can_route: false
    output_classification: "ADVISORY"
    allowed_write_paths:
      - "03_PRODUCTION/STYLE/"

  LIEFLAT_LESS_AI_TONE:
    role_type: "PRODUCTION_FILTER"
    read_canon: false
    read_state: false
    read_outline: false
    write_draft: "TONE_EDIT_ONLY"
    write_canon: false
    write_state: false
    can_route: false
    output_classification: "PRODUCTION-ARTIFACT"
    diff_integrity_enforced: true
    allowed_write_paths:
      - "03_PRODUCTION/TONE/"
      - "03_PRODUCTION/FINAL/"
